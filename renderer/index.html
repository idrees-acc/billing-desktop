<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing &amp; GST Invoicing</title>
<style>
:root{
  --ink:#141A2A; --slate:#5A6379; --mute:#8A92A6;
  --line:#E3E6EC; --wash:#F5F6F9; --surface:#FFFFFF;
  --plum:#6E2B52; --plum-soft:#F3E9EE;
  --good:#17724F; --warn:#9A5B12; --bad:#9E2B2B;
  --sans: system-ui, "Segoe UI", "Avenir Next", Inter, Roboto, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--wash);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}
a{color:var(--plum)}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{display:flex;min-height:100vh}
#side{width:232px;flex:0 0 232px;background:var(--ink);color:#C9CFDE;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
#side .brand{padding:20px 18px 14px}
#side .brand b{display:block;font-family:var(--serif);font-size:19px;color:#fff;font-weight:500;letter-spacing:.2px}
#side .brand span{font-size:11.5px;color:#7E88A0}
#side nav{padding:4px 10px 24px}
#side .grp{padding:16px 8px 6px;font-size:11px;color:#6E7891;letter-spacing:.06em}
#side a.item{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:var(--r);color:#C9CFDE;text-decoration:none;font-size:13.5px}
#side a.item:hover{background:#1E2740;color:#fff}
#side a.item.on{background:#fff;color:var(--ink);font-weight:600}
#side a.item .pill{font-size:11px;color:#8A92A6}
#side a.item.on .pill{color:var(--plum)}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 26px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar h1{font-family:var(--serif);font-size:21px;font-weight:500;flex:1}
#gsearch{width:270px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--wash)}
#gsearch:focus{outline:2px solid var(--plum-soft);border-color:var(--plum)}
.wrap{padding:22px 26px 60px;max-width:1180px}

/* ---------- bits ---------- */
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:var(--r);cursor:pointer}
.btn:hover{border-color:#C7CCD8}
.btn.pri{background:var(--plum);border-color:var(--plum);color:#fff}
.btn.pri:hover{background:#59223F}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--plum);outline-offset:1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card>h2{font-size:13px;font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);letter-spacing:.01em}
.card .bd{padding:16px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>*{flex:1;min-width:180px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.bar .sp{flex:1}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12px;color:var(--slate);margin-bottom:4px}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--plum);box-shadow:0 0 0 3px var(--plum-soft)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;color:var(--slate);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFBFC}
.r{text-align:right}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--wash);border:1px solid var(--line);white-space:nowrap}
.tag.paid{color:var(--good);background:#EDF6F1;border-color:#CFE6DB}
.tag.part{color:var(--warn);background:#FBF2E6;border-color:#EBDCC2}
.tag.due{color:var(--bad);background:#FAEEEE;border-color:#EBD2D2}
.tag.draft{color:var(--slate)}
.empty{padding:38px 16px;text-align:center;color:var(--slate)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.hint{font-size:12.5px;color:var(--slate)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi .k{font-size:12px;color:var(--slate)}
.kpi .v{font-family:var(--serif);font-size:24px;margin-top:2px}
.kpi.accent{border-left:3px solid var(--plum)}
.banner{background:#FBF2E6;border:1px solid #EBDCC2;color:#6B4514;padding:10px 14px;border-radius:var(--r);margin-bottom:16px;font-size:13px}

/* ---------- modal ---------- */
#veil{position:fixed;inset:0;background:rgba(20,26,42,.42);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:40}
#veil.on{display:flex}
#modal{background:var(--surface);border-radius:10px;width:100%;max-width:660px;box-shadow:0 18px 50px rgba(20,26,42,.28)}
#modal h2{font-family:var(--serif);font-size:19px;font-weight:500;padding:16px 20px;border-bottom:1px solid var(--line)}
#modal .bd{padding:20px}
#modal .ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:60;transition:transform .22s;pointer-events:none}
#toast.on{transform:translateX(-50%) translateY(0)}

/* ---------- lock ---------- */
#lock{position:fixed;inset:0;background:var(--ink);color:#fff;display:none;align-items:center;justify-content:center;z-index:80}
#lock.on{display:flex}
#lock .box{width:280px;text-align:center}
#lock input{margin:14px 0;text-align:center;letter-spacing:.3em}
#login{position:fixed;inset:0;background:var(--ink);color:#fff;display:none;align-items:center;justify-content:center;z-index:90}
#login.on{display:flex}
#login .box{width:300px}
#login .brandline{font-family:var(--serif);font-size:22px;font-weight:500;margin-bottom:2px}
#login .sub{font-size:12px;color:#7E88A0;margin-bottom:20px}
#login label.f>span{color:#8A92A6}
#login input{background:#1E2740;border-color:#2C3752;color:#fff}
#login input:focus{border-color:var(--plum);box-shadow:0 0 0 3px rgba(110,43,82,.45)}
#loginErr{color:#F0B7B7;margin-top:10px;min-height:18px}

/* ---------- invoice sheet ---------- */
.sheetwrap{background:#DFE2E9;padding:26px;border-radius:8px}
.sheet{width:210mm;min-height:297mm;margin:0 auto;background:#fff;padding:16mm 15mm;box-shadow:0 6px 24px rgba(20,26,42,.16);color:#141A2A;font-size:11px;line-height:1.42}
.sheet .lh{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.sheet .lh .biz{font-family:var(--serif);font-size:23px;font-weight:500;line-height:1.1}
.sheet .lh .desig{color:#5A6379;font-size:11.5px;margin-top:3px}
.sheet .lh .meta{text-align:right;font-size:10.5px;color:#3D4457;white-space:pre-line}
.sheet .logo{max-height:56px;max-width:150px;margin-bottom:6px}
.sheet hr{border:0;border-top:1px solid #141A2A;margin:12px 0 0}
.sheet .title{text-align:center;font-family:var(--serif);font-size:15px;letter-spacing:.16em;margin:14px 0 12px}
.sheet .grid2{display:flex;gap:0;border:1px solid #C9CFDA}
.sheet .grid2>div{flex:1;padding:9px 11px}
.sheet .grid2>div+div{border-left:1px solid #C9CFDA}
.sheet .lbl{font-size:9.5px;color:#6C7589;margin-bottom:3px}
.sheet .kv{display:flex;justify-content:space-between;gap:12px}
.sheet .kv span:first-child{color:#6C7589}
.sheet table{border-collapse:collapse;width:100%;margin-top:12px}
.sheet th{background:#F2F3F6;border:1px solid #C9CFDA;padding:6px 8px;font-size:9.5px;color:#3D4457;letter-spacing:.02em}
.sheet td{border:1px solid #C9CFDA;padding:7px 8px;font-size:10.5px}
.sheet .tot{width:58%;margin-left:42%;margin-top:12px}
.sheet .tot td{border:0;padding:3px 0;font-size:11px}
.sheet .tot tr.g td{border-top:1px solid #141A2A;border-bottom:1px solid #141A2A;font-weight:700;font-size:12.5px;padding:6px 0}
.sheet .words{margin-top:12px;padding:8px 11px;background:#F7F5F7;border-left:2px solid var(--plum)}
.sheet .foot{display:flex;gap:14px;margin-top:16px;align-items:stretch}
.sheet .foot .bank{flex:1.4;border:1px solid #C9CFDA;padding:9px 11px}
.sheet .foot .sign{flex:1;border:1px solid #C9CFDA;padding:9px 11px;display:flex;flex-direction:column;justify-content:space-between;text-align:right}
.sheet .terms{margin-top:14px;font-size:9.8px;color:#3D4457}
.sheet .terms ol{margin:4px 0 0;padding-left:16px}
.sheet .end{margin-top:14px;text-align:center;font-size:9px;color:#8A92A6}

@media print{
  body{background:#fff}
  #side,.topbar,#veil,#toast,.noprint{display:none !important}
  .wrap{padding:0;max-width:none}
  .sheetwrap{background:#fff;padding:0}
  .sheet{width:auto;min-height:0;box-shadow:none;padding:12mm 10mm}
  @page{size:A4;margin:0}
}
@media (max-width:900px){
  #app{flex-direction:column}
  #side{width:auto;flex:none;height:auto;position:static}
  #side nav{display:flex;flex-wrap:wrap}
  .sheet{width:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><b id="brandName">Billing</b><span id="brandSub">GST invoicing &amp; receivables</span></div>
    <nav id="nav"></nav>
  </aside>
  <div id="main">
    <div class="topbar">
      <h1 id="ttl">Dashboard</h1>
      <input id="gsearch" type="search" placeholder="Search invoice, customer, show, PAN…" autocomplete="off">
      <button class="btn pri" data-act="new-invoice">New invoice</button>
    </div>
    <div class="wrap" id="view"></div>
  </div>
</div>
<div id="veil"><div id="modal"></div></div>
<div id="toast"></div>
<div id="login"><div class="box">
  <div class="brandline">Billing &amp; GST Invoicing</div>
  <div class="sub">Sign in to continue</div>
  <label class="f"><span>Username</span><input id="loginUser" autocomplete="username" autocapitalize="off" spellcheck="false"></label>
  <label class="f"><span>Password</span><input id="loginPass" type="password" autocomplete="current-password"></label>
  <button class="btn pri" style="width:100%" id="loginBtn">Sign in</button>
  <div id="loginErr" class="hint"></div>
</div></div>
<div id="lock"><div class="box">
  <div style="font-family:var(--serif);font-size:20px">Enter your PIN</div>
  <input id="pinIn" type="password" inputmode="numeric" autocomplete="off">
  <button class="btn pri" style="width:100%" data-act="unlock">Unlock</button>
  <div id="pinErr" class="hint" style="color:#F0B7B7;margin-top:8px"></div>
</div></div>
<script>
/* ===================== storage ===================== */
const KEY='gstbill.v1';
const DESKTOP = typeof window!=='undefined' && !!window.desktop;
let DB=null, MEM=false, VIEW='dashboard', ARG=null, Q='';

function blank(){return{
  business:{name:'',designation:'',address:'',city:'',state:'Maharashtra',stateCode:'27',pin:'',pan:'',gstin:'',mobile:'',email:'',website:'',regno:'',logo:''},
  settings:{prefix:'INV',sep:'/',digits:3,start:1,pattern:'{PREFIX}{SEP}{FY}{SEP}{NUMBER}',
    terms:['Payment is requested as per agreed terms.','Any applicable TDS may be deducted as per applicable provisions.','Interest on delayed payment, if applicable, shall be as mutually agreed.'],
    showLogo:true, defaultBank:'', pinHash:'', ageBasis:'invoice'},
  customers:[],services:[],shows:[],banks:[],invoices:[],payments:[],audit:[],seq:{}
};}

function load(){
  if(DESKTOP){
    try{const raw=window.desktop.read(); if(raw){DB=JSON.parse(raw); return;} }
    catch(e){alert('The data file could not be read:\n'+e.message+'\n\nRestore a backup from the File menu.');}
    DB=blank(); seed(); save(); return;
  }
  try{const raw=localStorage.getItem(KEY); if(raw){DB=JSON.parse(raw); return;} }
  catch(e){MEM=true;}
  DB=blank(); seed(); save();
}
function save(){
  if(DESKTOP){
    try{window.desktop.write(JSON.stringify(DB));}
    catch(e){toast('Could not write to the data file: '+e.message);}
    return;
  }
  if(MEM) return;
  try{localStorage.setItem(KEY,JSON.stringify(DB));}
  catch(e){MEM=true; toast('Data could not be saved in this window — download a backup.');}
}
function logit(action,ref){
  DB.audit.unshift({t:new Date().toISOString(),action:action,ref:ref||''});
  if(DB.audit.length>4000) DB.audit.length=4000;
}

/* ===================== helpers ===================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>{const x=parseFloat(v);return isFinite(x)?x:0;};
const r2=v=>Math.round((n(v)+Number.EPSILON)*100)/100;

function inr(v,sym){v=r2(v);const neg=v<0;v=Math.abs(v);
  let[i,d]=v.toFixed(2).split('.');let last3=i.slice(-3),rest=i.slice(0,-3);
  if(rest)last3=','+last3;rest=rest.replace(/\B(?=(\d{2})+(?!\d))/g,',');
  return (neg?'-':'')+(sym===false?'':'\u20B9')+rest+last3+'.'+d;}
const amt=v=>inr(v);
const plain=v=>inr(v,false);

const ONES=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const TENS=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function w2(x){return x<20?ONES[x]:TENS[Math.floor(x/10)]+(x%10?' '+ONES[x%10]:'');}
function w3(x){let s='';if(x>99){s=ONES[Math.floor(x/100)]+' Hundred';x%=100;if(x)s+=' '+w2(x);}else s=w2(x);return s;}
function words(x){x=Math.floor(x);if(x===0)return'Zero';let p=[];
  const cr=Math.floor(x/10000000);x%=10000000;
  const lk=Math.floor(x/100000);x%=100000;
  const th=Math.floor(x/1000);x%=1000;
  if(cr)p.push(w3(cr)+' Crore'); if(lk)p.push(w3(lk)+' Lakh'); if(th)p.push(w3(th)+' Thousand'); if(x)p.push(w3(x));
  return p.join(' ');}
function rupeesInWords(v){v=r2(v);const rs=Math.floor(v),ps=Math.round((v-rs)*100);
  let s='Rupees '+words(rs); if(ps)s+=' and '+w2(ps)+' Paise'; return s+' Only';}

const today=()=>new Date().toISOString().slice(0,10);
function dmy(iso){if(!iso)return'';const[y,m,d]=iso.split('-');return d+'/'+m+'/'+y;}
function fyOf(iso){const d=new Date(iso||today());const y=d.getFullYear();const s=d.getMonth()>=3?y:y-1;return s+'-'+String(s+1).slice(2);}
function fyRange(fy){const s=parseInt(fy.slice(0,4),10);return[s+'-04-01',(s+1)+'-03-31'];}
function inFY(iso,fy){const[a,b]=fyRange(fy);return iso>=a&&iso<=b;}
function daysBetween(a,b){return Math.floor((new Date(b)-new Date(a))/86400000);}
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

const STATES=[['Jammu & Kashmir','01'],['Himachal Pradesh','02'],['Punjab','03'],['Chandigarh','04'],['Uttarakhand','05'],['Haryana','06'],['Delhi','07'],['Rajasthan','08'],['Uttar Pradesh','09'],['Bihar','10'],['Sikkim','11'],['Arunachal Pradesh','12'],['Nagaland','13'],['Manipur','14'],['Mizoram','15'],['Tripura','16'],['Meghalaya','17'],['Assam','18'],['West Bengal','19'],['Jharkhand','20'],['Odisha','21'],['Chhattisgarh','22'],['Madhya Pradesh','23'],['Gujarat','24'],['Dadra & Nagar Haveli and Daman & Diu','26'],['Maharashtra','27'],['Karnataka','29'],['Goa','30'],['Lakshadweep','31'],['Kerala','32'],['Tamil Nadu','33'],['Puducherry','34'],['Andaman & Nicobar Islands','35'],['Telangana','36'],['Andhra Pradesh','37'],['Ladakh','38'],['Other Territory','97']];
const stateName=c=>(STATES.find(s=>s[1]===c)||['',''])[0];
const stateOpts=(sel)=>STATES.map(s=>'<option value="'+s[1]+'"'+(s[1]===sel?' selected':'')+'>'+s[0]+' ('+s[1]+')</option>').join('');
const GSTRATES=[0,5,12,18,28];

const byId=(arr,id)=>arr.find(x=>x.id===id)||null;
const custName=id=>(byId(DB.customers,id)||{name:'—'}).name;
const showName=id=>(byId(DB.shows,id)||{name:''}).name;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600);}
function dl(name,content,type){
  if(DESKTOP && typeof content==='string'){window.desktop.saveFile(name,content);return;}
  const b=content instanceof Blob?content:new Blob([content],{type:type||'text/plain;charset=utf-8'});
  const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}

/* ===================== money engine ===================== */
function taxSplit(inv){
  const supply=DB.business.stateCode||'27';
  const mode=inv.taxMode||'auto';
  if(mode==='intra')return'intra'; if(mode==='inter')return'inter';
  const pos=inv.pos||supply;
  return pos===supply?'intra':'inter';
}
function totals(inv){
  const kind=taxSplit(inv);
  let taxable=0,cgst=0,sgst=0,igst=0;const buckets={};
  (inv.items||[]).forEach(it=>{
    const v=r2(n(it.qty)*n(it.rate)); taxable+=v;
    const rate=n(it.gst), tax=inv.rcm?0:r2(v*rate/100);
    if(!buckets[rate])buckets[rate]={taxable:0,tax:0};
    buckets[rate].taxable+=v; buckets[rate].tax+=tax;
    if(kind==='intra'){cgst+=tax/2;sgst+=tax/2;}else{igst+=tax;}
  });
  taxable=r2(taxable);cgst=r2(cgst);sgst=r2(sgst);igst=r2(igst);
  const tax=r2(cgst+sgst+igst);
  const grand=r2(taxable+tax);
  const round=r2(Math.round(grand)-grand);
  return{kind,taxable,cgst,sgst,igst,tax,grand:Math.round(grand),round,buckets};
}
const paysOf=id=>DB.payments.filter(p=>p.invoiceId===id);
function settled(inv){return r2(paysOf(inv.id).reduce((s,p)=>s+n(p.amount)+n(p.tds)+n(p.discount),0));}
function received(inv){return r2(paysOf(inv.id).reduce((s,p)=>s+n(p.amount),0));}
function tdsOf(inv){return r2(paysOf(inv.id).reduce((s,p)=>s+n(p.tds),0));}
function discOf(inv){return r2(paysOf(inv.id).reduce((s,p)=>s+n(p.discount),0));}
function outstanding(inv){return r2(totals(inv).grand-settled(inv));}
function status(inv){
  if(inv.cancelled)return'Cancelled';
  if(inv.draft)return'Draft';
  const o=outstanding(inv);
  if(o<=0.49)return'Paid';
  return settled(inv)>0?'Partially Paid':'Finalized';
}
function statusTag(inv){const s=status(inv);
  const c=s==='Paid'?'paid':s==='Partially Paid'?'part':s==='Draft'||s==='Cancelled'?'draft':'due';
  return '<span class="tag '+c+'">'+s+'</span>';}
const liveInvoices=()=>DB.invoices.filter(i=>!i.draft&&!i.cancelled);

function nextNumber(dateISO){
  const fy=fyOf(dateISO); const s=DB.settings;
  const used=DB.invoices.filter(i=>i.no&&i.fy===fy).map(i=>i.seq||0);
  const nx=Math.max(s.start-1,...used,0)+1;
  const num=String(nx).padStart(s.digits,'0');
  const no=s.pattern.replace(/{PREFIX}/g,s.prefix).replace(/{SEP}/g,s.sep).replace(/{FY}/g,fy).replace(/{NUMBER}/g,num);
  return{no,seq:nx,fy};
}

/* ===================== seed ===================== */
function seed(){
  DB.business={name:'Tripti Arora',designation:'Fashion Stylist / Costume Designer',address:'',city:'Mumbai',state:'Maharashtra',stateCode:'27',pin:'',pan:'',gstin:'',mobile:'',email:'',website:'',regno:'',logo:''};
  DB.banks=[{id:uid(),name:'HDFC Bank',holder:'Tripti Arora',acno:'',branch:'Thakur Complex',ifsc:'',upi:'',notes:'',active:true}];
  DB.settings.defaultBank=DB.banks[0].id;

function fields(list,d){
  d=d||{};
  return list.map(f=>{
    const v=d[f.k]!==undefined&&d[f.k]!==null?d[f.k]:(f.def!==undefined?f.def:'');
    let inp;
    if(f.type==='select')inp='<select name="'+f.k+'">'+f.opts.map(o=>'<option value="'+esc(o[0])+'"'+(String(o[0])===String(v)?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';
    else if(f.type==='state')inp='<select name="'+f.k+'">'+stateOpts(v||'')+'</select>';
    else if(f.type==='textarea')inp='<textarea name="'+f.k+'" rows="'+(f.rows||3)+'">'+esc(v)+'</textarea>';
    else if(f.type==='check')inp='<select name="'+f.k+'"><option value="1"'+(v?' selected':'')+'>Yes</option><option value=""'+(!v?' selected':'')+'>No</option></select>';
    else inp='<input name="'+f.k+'" type="'+(f.type||'text')+'" value="'+esc(v)+'"'+(f.step?' step="'+f.step+'"':'')+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+'>';
    return '<label class="f" style="flex:'+(f.w||1)+';min-width:'+(f.w===2?'100%':'170px')+'"><span>'+esc(f.label)+'</span>'+inp+'</label>';
  }).join('');
}

function agg(list){
  let bill=0,rec=0,tds=0,disc=0,out=0;
  list.forEach(i=>{const t=totals(i);bill+=t.grand;rec+=received(i);tds+=tdsOf(i);disc+=discOf(i);out+=outstanding(i);});
  return{bill:r2(bill),rec:r2(rec),tds:r2(tds),disc:r2(disc),out:r2(out)};
}
function kpi(k,v,cls){return'<div class="kpi'+(cls?' '+cls:'')+'"><div class="k">'+k+'</div><div class="v num">'+v+'</div></div>';}
function vDash(){
  const fy=fyOf(today()),live=liveInvoices();

  const monthRec=r2(DB.payments.filter(p=>p.date.slice(0,7)===mon).reduce((s,p)=>s+n(p.amount),0));
  const monthTds=r2(DB.payments.filter(p=>p.date.slice(0,7)===mon).reduce((s,p)=>s+n(p.tds),0));
  const openCnt=live.filter(i=>outstanding(i)>0.49).length;
  const partCnt=live.filter(i=>status(i)==='Partially Paid').length;
  const paidCnt=live.filter(i=>status(i)==='Paid').length;
  const recent=[...live].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  const rp=[...DB.payments].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);

      '<div style="margin-top:14px;display:flex;gap:10px;justify-content:center"><a class="btn" href="#profile">Business profile</a><a class="btn pri" href="#new">New invoice</a></div></div></div>';
  }

  '<div class="row">'+kpi('Billed',amt(m.bill),'accent')+kpi('Received',amt(monthRec))+kpi('TDS deducted',amt(monthTds))+kpi('Invoices',m.bill?String(live.filter(i=>i.date.slice(0,7)===mon).length):'0')+'</div>'+
  '<h2 style="font-family:var(--serif);font-weight:500;font-size:16px;margin:22px 0 10px">Financial year '+fy+'</h2>'+
  '<div class="row">'+kpi('Billed',amt(y.bill),'accent')+kpi('Received',amt(y.rec))+kpi('TDS',amt(y.tds))+kpi('Outstanding',amt(y.out))+'</div>'+
  '<div class="row" style="margin-top:14px">'+kpi('Open invoices',String(openCnt))+kpi('Part paid',String(partCnt))+kpi('Fully settled',String(paidCnt))+kpi('Customers',String(DB.customers.length))+'</div>'+
  '<div class="row" style="margin-top:22px;align-items:flex-start">'+
   '<div class="card" style="flex:1.2"><h2>Recent invoices</h2><table><tbody>'+
    (recent.length?recent.map(i=>'<tr><td><a href="#invoice/'+i.id+'">'+esc(i.no)+'</a><div class="hint">'+dmy(i.date)+'</div></td><td>'+esc(custName(i.customerId))+'<div class="hint">'+esc(showName(i.showId))+'</div></td><td class="r num">'+amt(totals(i).grand)+'</td><td class="r">'+statusTag(i)+'</td></tr>').join(''):'<tr><td class="hint">Nothing yet.</td></tr>')+
   '</tbody></table></div>'+

    (rp.length?rp.map(p=>{const i=byId(DB.invoices,p.invoiceId)||{no:'—'};return'<tr><td>'+dmy(p.date)+'<div class="hint">'+esc(i.no)+'</div></td><td class="r num">'+amt(p.amount)+(n(p.tds)?'<div class="hint">TDS '+amt(p.tds)+'</div>':'')+'</td></tr>';}).join(''):'<tr><td class="hint">No payments recorded.</td></tr>')+
   '</tbody></table></div>'+
  '</div>';
}

function wireEditor(){
  $('#view').addEventListener('change',onEditChange);
  $('#view').addEventListener('input',e=>{if(e.target.matches('[data-f="desc"],[data-f="sac"],[data-f="notes"]'))onEditChange(e,true);});
}
function onEditChange(e,quiet){
  const el=e.target,f=el.dataset.f;if(!f||!DRAFT)return;
  if(el.dataset.i!==undefined){
    const it=DRAFT.items[+el.dataset.i];
    if(f==='serviceId'){
      it.serviceId=el.value;const s=byId(DB.services,el.value);
      if(s){it.desc=s.desc||s.name;it.sac=s.sac||'';it.unit=s.unit||'';it.gst=n(s.gst);if(!n(it.rate))it.rate=n(s.rate);}
    } else it[f]=(f==='qty'||f==='rate'||f==='gst')?n(el.value):el.value;
  } else {
    if(f==='rcm')DRAFT.rcm=!!el.value;
    else DRAFT[f]=el.value;
    if(f==='customerId'){const c=byId(DB.customers,el.value);if(c&&c.stateCode)DRAFT.pos=c.stateCode;DRAFT.showId='';}
  }
  if(!quiet)render();
}
function saveInvoice(final){
  const inv=DRAFT;
  if(!inv.customerId){toast('Choose a customer first');return;}
  if(!inv.items.some(i=>n(i.qty)*n(i.rate)>0)){toast('Add at least one line with an amount');return;}
  inv.items.forEach(i=>{if(!i.desc){const s=byId(DB.services,i.serviceId);i.desc=s?(s.desc||s.name):'Professional services';}});
  inv.fy=fyOf(inv.date);
  if(final&&!inv.no){const x=nextNumber(inv.date);inv.no=x.no;inv.seq=x.seq;inv.fy=x.fy;}
  if(final)inv.draft=false;
  const ex=byId(DB.invoices,inv.id);
  const clean=JSON.parse(JSON.stringify(inv));delete clean._for;
  if(ex)Object.assign(ex,clean);else DB.invoices.push(clean);
  logit(ex?'Invoice updated':'Invoice created',inv.no||'draft');
  save();DRAFT=null;
  toast(final?'Invoice '+(clean.no||'')+' saved':'Draft saved');
  go(final?'invoice/'+clean.id:'drafts');
}

function payModal(invId,payId){
  const p=payId?byId(DB.payments,payId):null;
  const inv=byId(DB.invoices,p?p.invoiceId:invId);
  if(!inv){toast('Invoice not found');return;}
  const due=outstanding(inv)+(p?n(p.amount)+n(p.tds)+n(p.discount):0);
  const F=[{k:'date',label:'Payment date',type:'date',def:today()},{k:'amount',label:'Amount received',type:'number',step:'0.01'},
   {k:'tds',label:'TDS deducted',type:'number',step:'0.01',def:0},{k:'discount',label:'Discount / write-off',type:'number',step:'0.01',def:0},
   {k:'mode',label:'Mode',type:'select',opts:[['NEFT/RTGS','NEFT / RTGS'],['UPI','UPI'],['Cheque','Cheque'],['Cash','Cash'],['Other','Other']]},
   {k:'bank',label:'Received in',type:'select',opts:[['','—']].concat(DB.banks.map(b=>[b.name,b.name]))},
   {k:'ref',label:'Reference no.'},{k:'remarks',label:'Remarks',w:2}];
  openModal((p?'Edit payment':'Record payment')+' — '+(inv.no||'draft'),
    '<p class="hint" style="margin-top:0">'+esc(custName(inv.customerId))+' · invoice '+amt(totals(inv).grand)+' · outstanding '+amt(due)+'</p><div class="row">'+fields(F,p||{date:today(),amount:due,tds:0,discount:0})+'</div>',
    'Save payment',()=>{
      const f=readForm();
      f.amount=n(f.amount);f.tds=n(f.tds);f.discount=n(f.discount);
      if(f.amount+f.tds+f.discount<=0){toast('Enter an amount, TDS or discount');return;}
      if(p){Object.assign(p,f);logit('Payment updated',inv.no);}
      else{DB.payments.push(Object.assign({id:uid(),invoiceId:inv.id},f));logit('Payment recorded',inv.no);}
      save();closeModal();render();toast('Payment saved');
    });
}

    sh[name].forEach((row,ri)=>{
      x+='<Row>'+row.map(c=>{

function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(cur);cur='';}
    else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
    else if(ch!=='\r')cur+=ch;}
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function importPreview(kind,text){
  const rows=parseCSV(text);if(rows.length<2){toast('That file has no rows');return;}
  const body=rows.slice(1).map(r=>r.map(c=>c.trim()));
  const existing=DB[kind].map(x=>(x.name||'').toLowerCase());
  const add=[],dupe=[],bad=[];
  body.forEach(r=>{const name=r[0];
    if(!name){bad.push(r);return;}
    if(existing.includes(name.toLowerCase())){dupe.push(r);return;}
    add.push(r);existing.push(name.toLowerCase());});
  openModal('Import '+kind,
    '<div class="row">'+kpi('Will be added',String(add.length))+kpi('Duplicates skipped',String(dupe.length))+kpi('No name — skipped',String(bad.length))+'</div>'+
    (add.length?'<table style="margin-top:14px"><thead><tr><th>Name</th><th>Rest of the row</th></tr></thead><tbody>'+
      add.slice(0,12).map(r=>'<tr><td>'+esc(r[0])+'</td><td class="hint">'+esc(r.slice(1).join(' · '))+'</td></tr>').join('')+
      (add.length>12?'<tr><td colspan="2" class="hint">and '+(add.length-12)+' more…</td></tr>':'')+'</tbody></table>':'<p class="hint">Nothing new to import.</p>'),
    'Import '+add.length+' rows',()=>{
      add.forEach(r=>{
        if(kind==='customers')DB.customers.push({id:uid(),name:r[0],gstin:r[1]||'',pan:r[2]||'',address:r[3]||'',city:r[4]||'',stateCode:r[5]||DB.business.stateCode,pin:r[6]||'',email:r[7]||'',mobile:r[8]||'',contact:r[9]||'',terms:'',notes:'',active:true});
        if(kind==='services')DB.services.push({id:uid(),name:r[0],sac:r[1]||'',desc:r[2]||r[0],unit:r[3]||'Job',rate:n(r[4]),gst:r[5]?n(r[5]):18,active:true});
        if(kind==='shows'){const c=DB.customers.find(x=>x.name.toLowerCase()===(r[1]||'').toLowerCase());
          DB.shows.push({id:uid(),name:r[0],customerId:c?c.id:'',house:r[2]||'',desc:'',active:true,notes:''});}
      });
      logit('Imported '+add.length+' '+kind);save();closeModal();render();toast(add.length+' rows imported');
    },true);
}

  return'<div class="card"><table><thead><tr><th>When</th><th>Action</th><th>Reference</th></tr></thead><tbody>'+
   DB.audit.slice(0,300).map(a=>{const d=new Date(a.t);
    return'<tr><td>'+dmy(a.t.slice(0,10))+' '+a.t.slice(11,16)+'</td><td>'+esc(a.action)+'</td><td class="hint">'+esc(a.ref)+'</td></tr>';}).join('')+
   '</tbody></table></div>';
}
function vSettings(){
  const s=DB.settings;
  const sample=nextNumber(today()).no;
  return'<div class="row" style="align-items:flex-start">'+
  '<div style="flex:1.1;min-width:320px"><div class="card"><h2>Invoice numbering</h2><div class="bd"><form id="numForm"><div class="row">'+
   fields([{k:'prefix',label:'Prefix'},{k:'sep',label:'Separator'},{k:'digits',label:'Digits',type:'number'},{k:'start',label:'Start from',type:'number'},
    {k:'pattern',label:'Pattern',w:2,ph:'{PREFIX}{SEP}{FY}{SEP}{NUMBER}'}],s)+
   '</div></form><p class="hint">Next invoice will be <b>'+esc(sample)+'</b>. Numbers restart each financial year and cannot repeat.</p>'+
   '<button class="btn pri" data-act="num-save">Save numbering</button></div></div>'+
   '<div class="card" style="margin-top:16px"><h2>Terms printed on invoices</h2><div class="bd">'+
    '<textarea id="termsIn" rows="5">'+esc(s.terms.join('\n'))+'</textarea>'+
    '<p class="hint">One per line. The reverse-charge line is added automatically from each invoice.</p>'+
    '<button class="btn pri" data-act="terms-save">Save terms</button></div></div>'+
  '</div>'+
  '<div style="flex:1;min-width:280px">'+
   '<div class="card"><h2>Invoice appearance</h2><div class="bd">'+
    '<label class="f"><span>Show logo on invoices</span><select id="logoShow"><option value="1"'+(s.showLogo?' selected':'')+'>Yes</option><option value=""'+(!s.showLogo?' selected':'')+'>No</option></select></label>'+
    '<label class="f"><span>Default bank account</span><select id="defBank"><option value="">None</option>'+DB.banks.map(b=>'<option value="'+b.id+'"'+(b.id===s.defaultBank?' selected':'')+'>'+esc(b.name)+'</option>').join('')+'</select></label>'+
    '<button class="btn pri" data-act="appearance-save">Save</button></div></div>'+
   '<div class="card" style="margin-top:16px"><h2>Lock with a PIN</h2><div class="bd">'+
    (s.pinHash?'<p style="margin-top:0">A PIN is set. The app asks for it each time it opens.</p><button class="btn danger" data-act="pin-clear">Remove PIN</button>'
     :'<p style="margin-top:0">Optional. Asked for when the app opens on this computer.</p><label class="f"><span>New PIN</span><input id="pinNew" type="password" inputmode="numeric"></label><button class="btn pri" data-act="pin-set">Set PIN</button>')+
    '<p class="hint">Stored only as a one-way hash, never as the PIN itself. It keeps casual eyes out; it is not disk encryption.</p></div></div>'+
  '</div></div>';
}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
/* ===================== routing fix + editor wiring ===================== */
function route(){
  const h=location.hash.replace('#','')||'dashboard';
  const i=h.indexOf('/');
  VIEW=i<0?h:h.slice(0,i);
  ARG=i<0?null:decodeURIComponent(h.slice(i+1));
  render();window.scrollTo(0,0);
}
function wireEditor(){
  if(wireEditor._on)return;wireEditor._on=true;
  const v=$('#view');
  v.addEventListener('change',e=>{if((VIEW==='new'||VIEW==='edit')&&e.target.dataset.f)onEditChange(e);});
  v.addEventListener('input',e=>{if((VIEW==='new'||VIEW==='edit')&&e.target.matches('[data-f="desc"],[data-f="sac"],[data-f="notes"]'))onEditChange(e,true);});
}

/* ===================== events ===================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  const stop=()=>e.preventDefault();
  switch(a){
    case'new-invoice':stop();DRAFT=null;go('new');break;
    case'close-modal':stop();closeModal();break;
    case'modal-save':stop();if(MODAL_SAVE)MODAL_SAVE();break;
    case'cust-new':stop();editCustomer();break;
    case'cust-edit':stop();editCustomer(id);break;
    case'svc-new':stop();editService();break;
    case'svc-edit':stop();editService(id);break;
    case'show-new':stop();editShow();break;
    case'show-edit':stop();editShow(id);break;
    case'bank-new':stop();editBank();break;
    case'bank-edit':stop();editBank(id);break;
    case'profile-save':stop();{Object.assign(DB.business,readIn('#profileForm'));DB.business.state=stateName(DB.business.stateCode);logit('Business profile updated');save();render();toast('Profile saved');}break;
    case'logo-clear':stop();DB.business.logo='';save();render();break;
    case'item-add':stop();DRAFT.items.push({serviceId:'',desc:'',sac:'',unit:'',qty:1,rate:0,gst:18});render();break;
    case'item-del':stop();DRAFT.items.splice(+t.dataset.i,1);render();break;
    case'inv-save-draft':stop();saveInvoice(false);break;
    case'inv-finalize':stop();saveInvoice(true);break;
    case'print':stop();window.print();break;
    case'pay-new':stop();payModal(id);break;
    case'pay-edit':stop();payModal(null,id);break;
    case'inv-copy':stop();{const src=byId(DB.invoices,id);
      DRAFT=Object.assign(JSON.parse(JSON.stringify(src)),{id:uid(),no:'',seq:0,draft:true,cancelled:false,date:today(),fy:fyOf(today()),createdAt:new Date().toISOString(),_for:'new'});
      go('new');render();toast('Copied — give it a date and finalise');}break;
    case'inv-cancel':stop();{const inv=byId(DB.invoices,id);
      if(paysOf(inv.id).length){toast('Remove the payments on this invoice first');break;}
      openModal('Cancel invoice '+inv.no,'<p style="margin-top:0">The invoice stays in your records and keeps its number, marked as cancelled. This cannot be undone.</p>','Cancel invoice',()=>{
        inv.cancelled=true;logit('Invoice cancelled',inv.no);save();closeModal();render();toast('Invoice cancelled');});}break;
    case'draft-del':stop();{const ix=DB.invoices.findIndex(x=>x.id===id);
      openModal('Delete draft','<p style="margin-top:0">Drafts have no invoice number, so nothing in your records changes.</p>','Delete draft',()=>{
        DB.invoices.splice(ix,1);logit('Draft deleted');save();closeModal();render();toast('Draft deleted');});}break;
    case'backup':stop();backup();break;
    case'excel':stop();exportExcel();break;
    case'csv':stop();exportCSV(t.dataset.sheet);break;
    case'csv-invoices':stop();exportCSV('Invoice Register');break;
    case'csv-outstanding':stop();exportCSV('Outstanding');break;
    case'csv-payments':stop();exportCSV('Payment Register');break;
    case'csv-party':stop();exportCSV('Party-wise Summary');break;
    case'csv-show':stop();exportCSV('Show-wise Summary');break;
    case'csv-tds':stop();exportCSV('TDS Register');break;
    case'csv-gst':stop();exportCSV('GST Summary');break;
    case'csv-month':stop();exportCSV('Invoice Register');break;
    case'find':stop();go('search/'+encodeURIComponent(t.dataset.q));break;
    case'num-save':stop();{const f=readIn('#numForm');
      DB.settings.prefix=f.prefix;DB.settings.sep=f.sep;DB.settings.digits=Math.max(1,n(f.digits)||3);DB.settings.start=Math.max(1,n(f.start)||1);
      DB.settings.pattern=f.pattern||'{PREFIX}{SEP}{FY}{SEP}{NUMBER}';logit('Numbering updated');save();render();toast('Numbering saved');}break;
    case'terms-save':stop();DB.settings.terms=$('#termsIn').value.split('\n').map(x=>x.trim()).filter(Boolean);save();render();toast('Terms saved');break;
    case'appearance-save':stop();DB.settings.showLogo=!!$('#logoShow').value;DB.settings.defaultBank=$('#defBank').value;save();render();toast('Saved');break;
    case'pin-set':stop();{const v=$('#pinNew').value.trim();if(v.length<4){toast('Use at least 4 digits');break;}
      sha(v).then(h=>{DB.settings.pinHash=h;logit('PIN set');save();render();toast('PIN set');});}break;
    case'pin-clear':stop();DB.settings.pinHash='';logit('PIN removed');save();render();toast('PIN removed');break;
    case'unlock':stop();{const v=$('#pinIn').value;sha(v).then(h=>{
      if(h===DB.settings.pinHash){$('#lock').classList.remove('on');$('#pinErr').textContent='';}
      else $('#pinErr').textContent='That PIN did not match. Try again.';});}break;
    case'wipe':stop();openModal('Erase all data','<p style="margin-top:0">Every invoice, payment and master record on this computer will be removed. Download a backup first if you have not already.</p>','Erase everything',()=>{
      DB=blank();save();closeModal();go('dashboard');render();toast('All data erased');});break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='fyPick'){FY=el.value;render();}
  if(el.id==='logoIn'&&el.files[0]){const r=new FileReader();
    r.onload=()=>{DB.business.logo=r.result;save();render();toast('Logo added');};r.readAsDataURL(el.files[0]);}
  if(el.id==='restoreIn'&&el.files[0]){const f=el.files[0],r=new FileReader();
    r.onload=()=>{
      let d;try{d=JSON.parse(r.result);}catch(x){toast('That file is not a valid backup');return;}
      if(!d||!Array.isArray(d.invoices)){toast('That file is not a valid backup');return;}
      openModal('Restore backup','<p style="margin-top:0">This replaces everything currently in the app with the contents of <b>'+esc(f.name)+'</b>: '+
        d.invoices.length+' invoices, '+(d.customers||[]).length+' customers, '+(d.payments||[]).length+' payments.</p>'+
        '<p>A copy of your current data downloads first, so you can go back.</p>','Restore',()=>{
        backup();DB=Object.assign(blank(),d);logit('Backup restored',f.name);save();closeModal();go('dashboard');render();toast('Backup restored');});
    };r.readAsText(f);}
  if(el.classList.contains('impIn')&&el.files[0]){const r=new FileReader();
    const kind=el.dataset.kind;r.onload=()=>importPreview(kind,r.result);r.readAsText(el.files[0]);}
});

/* ===================== sign in ===================== */
/* Only a PBKDF2-SHA256 digest of the credential lives here; the username and
   password themselves are never in the source and never leave the browser. */
const AUTH={salt:'gstbill.auth.v1',iter:200000,
  hash:'fc455b9331081441a6f423c967daa30b24976aeb40fa31096f8810e669adc35b'};
async function derive(user,pass){
  const enc=new TextEncoder();
  const k=await crypto.subtle.importKey('raw',enc.encode(user.trim().toLowerCase()+':'+pass),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(AUTH.salt),iterations:AUTH.iter,hash:'SHA-256'},k,256);
  return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function startApp(){
  $('#login').classList.remove('on');
  if(DB.settings.pinHash)$('#lock').classList.add('on');
  route();
}
async function signIn(){
  const btn=$('#loginBtn');btn.disabled=true;$('#loginErr').textContent='';
  const ok=await derive($('#loginUser').value,$('#loginPass').value)===AUTH.hash;
  btn.disabled=false;
  if(!ok){$('#loginErr').textContent='Those details did not match.';$('#loginPass').value='';$('#loginPass').focus();return;}
  sessionStorage.setItem('gstbill.auth',AUTH.hash);
  $('#loginUser').value='';$('#loginPass').value='';
  startApp();
}
$('#loginBtn').addEventListener('click',signIn);
$('#login').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();signIn();}});

/* ===================== start ===================== */
load();
if(sessionStorage.getItem('gstbill.auth')===AUTH.hash){startApp();}
else{$('#login').classList.add('on');$('#loginUser').focus();}

/* ===================== desktop shell ===================== */
if(DESKTOP){
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-act]');if(!t)return;
    const a=t.dataset.act;
    if(a==='backup-native'){e.preventDefault();window.desktop.backupNow();logit('Backup taken');save();}
    if(a==='restore-native'){e.preventDefault();window.desktop.restore();}
    if(a==='data-folder'){e.preventDefault();window.desktop.openDataFolder();}
    if(a==='backups-folder'){e.preventDefault();window.desktop.openDataFolder();}
    if(a==='save-pdf'){e.preventDefault();savePDF(t.dataset.id);}
  });
  window.desktop.onMenu(what=>{
    if(what==='new-invoice'){DRAFT=null;go('new');}
    else if(what==='excel')exportExcel();
    else if(what==='save-pdf'){
      if(VIEW==='invoice'&&ARG)savePDF(ARG);
      else toast('Open an invoice first, then save it as PDF');
    }
    else if(what.indexOf('go:')===0)go(what.slice(3));
  });
}
function savePDF(id){
  const inv=byId(DB.invoices,id);
  if(!inv){toast('Open an invoice first');return;}
  if(VIEW!=='invoice'||ARG!==id){go('invoice/'+id);setTimeout(()=>savePDF(id),120);return;}
  if(inv.draft){toast('Finalise the invoice before filing a PDF');return;}
  closeModal();
  window.desktop.savePDF({fy:inv.fy,customer:custName(inv.customerId),no:inv.no})
    .then(f=>{if(f){logit('PDF saved',inv.no);save();}});
}
